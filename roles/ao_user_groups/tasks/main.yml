---
- name: Manage AO Groups Block
  vars:
    ansible_async_dir: "{{ ao_configuration_async_dir }}"
  no_log: "{{ ao_configuration_user_groups_secure_logging }}"
  block:
    - name: Look up existing Groups
      ansible.builtin.uri:
        url: "{{ ao_hostname }}/api/v1/groups?limit={{ ao_configuration_user_groups_lookup_limit }}"
        method: GET
        headers:
          Authorization: "Bearer {{ ao_access_token }}"
        validate_certs: "{{ ao_validate_certs }}"
        timeout: "{{ ao_request_timeout }}"
        status_code: [200]
      register: __ao_user_groups_lookup
      changed_when: false

    - name: Managing Groups
      ansible.builtin.uri:
        url: "{{ __url }}"
        method: "{{ __method }}"
        headers:
          Authorization: "Bearer {{ ao_access_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ omit if __method == 'DELETE' else __body }}"
        status_code: "{{ [204] if __method == 'DELETE' else ([201] if __method == 'POST' else [200]) }}"
        validate_certs: "{{ ao_validate_certs }}"
        timeout: "{{ ao_request_timeout }}"
      when: not (__state == 'absent' and __existing is not defined)
      loop: "{{ ao_user_groups }}"
      loop_control:
        loop_var: __ao_user_groups_item
        label: "{{ __operation.verb }} Group {{ __ao_user_groups_item.name }}"
        pause: "{{ ao_configuration_user_groups_loop_delay }}"
      async: "{{ ansible_check_mode | ternary(0, 1000) }}"
      poll: 0
      register: __user_groups_job_async
      changed_when: (__user_groups_job_async.changed if ansible_check_mode else false)
      vars:
        __operation: "{{ operation_translate[__ao_user_groups_item.state | default(ao_state) | default('present')] }}"
        __existing: >-
          {{ (__ao_user_groups_lookup.json[ao_configuration_user_groups_list_key] | default([]))
             | selectattr('name', 'equalto', __ao_user_groups_item.name) | list | first | default(omit) }}
        __state: "{{ __ao_user_groups_item.state | default(ao_state | default('present')) }}"
        __method: "{{ 'DELETE' if __state == 'absent' else ('PATCH' if __existing is defined else 'POST') }}"
        __url: "{{ ao_hostname ~ '/api/v1/groups' ~ ('/' ~ __existing.id if __existing is defined else '') }}"
        __body:
          name: "{{ __ao_user_groups_item.name | mandatory }}"
          description: "{{ __ao_user_groups_item.description | default('', true) }}"
          user_usernames: "{{ __ao_user_groups_item.user_usernames | default([], true) }}"

    - name: Flag for errors (check mode only)
      ansible.builtin.set_fact:
        error_flag: true
      when: ansible_check_mode and __user_groups_job_async.failed is defined and __user_groups_job_async.failed

    - name: Managing Groups | Wait for finish the group management
      when:
        - not ansible_check_mode
        - __user_groups_job_async_results_item.ansible_job_id is defined
      ansible.builtin.include_role:
        name: zjleblanc.ao_configuration.collect_async_status
      loop: "{{ __user_groups_job_async.results }}"
      loop_control:
        loop_var: __user_groups_job_async_results_item
        label: >-
          {{ __operation.verb }} Group {{ __user_groups_job_async_results_item.__ao_user_groups_item.name }}
          | Wait for finish the group {{ __operation.action }}
      vars:
        cas_secure_logging: "{{ ao_configuration_user_groups_secure_logging }}"
        cas_async_delay: "{{ ao_configuration_user_groups_async_delay }}"
        cas_async_retries: "{{ ao_configuration_user_groups_async_retries }}"
        cas_job_async_results_item: "{{ __user_groups_job_async_results_item }}"
        cas_register_subvar: ao_user_groups
        cas_error_list_var_name: "ao_user_groups_errors"
        __operation: >-
          {{ operation_translate[__user_groups_job_async_results_item.__ao_user_groups_item.state
             | default(ao_state) | default('present')] }}
        cas_object_label: >-
          {{ __operation.verb }} Group {{ __user_groups_job_async_results_item.__ao_user_groups_item.name }}
          | Wait for finish the group {{ __operation.action }}

  always:
    - name: Cleanup async results files
      when:
        - not ansible_check_mode
        - __user_groups_job_async_results_item.ansible_job_id is defined
      ansible.builtin.async_status:
        jid: "{{ __user_groups_job_async_results_item.ansible_job_id }}"
        mode: cleanup
      loop: "{{ __user_groups_job_async.results }}"
      loop_control:
        loop_var: __user_groups_job_async_results_item
        label: "Cleaning up job results file: {{ __user_groups_job_async_results_item.results_file | default('Unknown') }}"
...
