---
# Role Assignments are an immutable link between a subject (user/group/service_account),
# a role, and an (optional) scoping project -- there is no PATCH; the assignment either
# exists or it doesn't, so this role only ever creates or deletes.
- name: Manage AO Role Assignments Block
  vars:
    ansible_async_dir: "{{ ao_configuration_async_dir }}"
  no_log: "{{ ao_configuration_role_assignments_secure_logging }}"
  block:
    - name: Look up existing Role Assignments
      ansible.builtin.uri:
        url: "{{ ao_hostname }}/api/v1/role_assignments?limit={{ ao_configuration_role_assignments_lookup_limit }}"
        method: GET
        headers:
          Authorization: "Bearer {{ ao_access_token }}"
        validate_certs: "{{ ao_validate_certs }}"
        timeout: "{{ ao_request_timeout }}"
        status_code: [200]
      register: __ao_role_assignments_lookup
      changed_when: false

    - name: Managing Role Assignments
      ansible.builtin.uri:
        url: "{{ __url }}"
        method: "{{ __method }}"
        headers:
          Authorization: "Bearer {{ ao_access_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ omit if __method == 'DELETE' else __body }}"
        status_code: "{{ [204] if __method == 'DELETE' else [201] }}"
        validate_certs: "{{ ao_validate_certs }}"
        timeout: "{{ ao_request_timeout }}"
      when: (__state == 'present' and __existing is not defined) or (__state == 'absent' and __existing is defined)
      loop: "{{ ao_role_assignments }}"
      loop_control:
        loop_var: __ao_role_assignments_item
        label: >-
          {{ __operation.verb }} Role Assignment
          {{ __ao_role_assignments_item.role_name }}->{{ __ao_role_assignments_item.subject_type }}:{{ __ao_role_assignments_item.subject_name }}
        pause: "{{ ao_configuration_role_assignments_loop_delay }}"
      async: "{{ ansible_check_mode | ternary(0, 1000) }}"
      poll: 0
      register: __role_assignments_job_async
      changed_when: (__role_assignments_job_async.changed if ansible_check_mode else false)
      vars:
        __operation: "{{ operation_translate[__ao_role_assignments_item.state | default(ao_state) | default('present')] }}"
        __existing: >-
          {{ (__ao_role_assignments_lookup.json[ao_configuration_role_assignments_list_key] | default([]))
             | selectattr('role_name', 'equalto', __ao_role_assignments_item.role_name)
             | selectattr('subject_type', 'equalto', __ao_role_assignments_item.subject_type)
             | selectattr('subject_name', 'equalto', __ao_role_assignments_item.subject_name)
             | selectattr('project_id', 'equalto', __ao_role_assignments_item.project_id | default(None))
             | list | first | default(omit) }}
        __state: "{{ __ao_role_assignments_item.state | default(ao_state | default('present')) }}"
        __method: "{{ 'DELETE' if __state == 'absent' else 'POST' }}"
        __url: >-
          {{ (ao_hostname ~ '/api/v1/role_assignments/' ~ __existing.id)
             if (__state == 'absent' and __existing is defined)
             else (ao_hostname ~ '/api/v1/role_assignments') }}
        __body:
          role_name: "{{ __ao_role_assignments_item.role_name | mandatory }}"
          subject_type: "{{ __ao_role_assignments_item.subject_type | mandatory }}"
          subject_name: "{{ __ao_role_assignments_item.subject_name | mandatory }}"
          project_id: "{{ __ao_role_assignments_item.project_id | default(omit, true) }}"

    - name: Flag for errors (check mode only)
      ansible.builtin.set_fact:
        error_flag: true
      when: ansible_check_mode and __role_assignments_job_async.failed is defined and __role_assignments_job_async.failed

    - name: Managing Role Assignments | Wait for finish the role assignment management
      when:
        - not ansible_check_mode
        - __role_assignments_job_async_results_item.ansible_job_id is defined
      ansible.builtin.include_role:
        name: zjleblanc.ao_configuration.collect_async_status
      loop: "{{ __role_assignments_job_async.results }}"
      loop_control:
        loop_var: __role_assignments_job_async_results_item
        label: >-
          {{ __operation.verb }} Role Assignment
          {{ __role_assignments_job_async_results_item.__ao_role_assignments_item.role_name }}
          | Wait for finish the role assignment {{ __operation.action }}
      vars:
        cas_secure_logging: "{{ ao_configuration_role_assignments_secure_logging }}"
        cas_async_delay: "{{ ao_configuration_role_assignments_async_delay }}"
        cas_async_retries: "{{ ao_configuration_role_assignments_async_retries }}"
        cas_job_async_results_item: "{{ __role_assignments_job_async_results_item }}"
        cas_register_subvar: ao_role_assignments
        cas_error_list_var_name: "ao_role_assignments_errors"
        __operation: >-
          {{ operation_translate[__role_assignments_job_async_results_item.__ao_role_assignments_item.state
             | default(ao_state) | default('present')] }}
        cas_object_label: >-
          {{ __operation.verb }} Role Assignment
          {{ __role_assignments_job_async_results_item.__ao_role_assignments_item.role_name }}
          | Wait for finish the role assignment {{ __operation.action }}

  always:
    - name: Cleanup async results files
      when:
        - not ansible_check_mode
        - __role_assignments_job_async_results_item.ansible_job_id is defined
      ansible.builtin.async_status:
        jid: "{{ __role_assignments_job_async_results_item.ansible_job_id }}"
        mode: cleanup
      loop: "{{ __role_assignments_job_async.results }}"
      loop_control:
        loop_var: __role_assignments_job_async_results_item
        label: "Cleaning up job results file: {{ __role_assignments_job_async_results_item.results_file | default('Unknown') }}"
...
