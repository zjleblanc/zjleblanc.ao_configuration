---
- name: Manage AO Users Block
  vars:
    ansible_async_dir: "{{ ao_configuration_async_dir }}"
  no_log: "{{ ao_configuration_users_secure_logging }}"
  block:
    - name: Look up existing Users
      ansible.builtin.uri:
        url: "{{ ao_hostname }}/api/v1/users?limit={{ ao_configuration_users_lookup_limit }}"
        method: GET
        headers:
          Authorization: "Bearer {{ ao_access_token }}"
        validate_certs: "{{ ao_validate_certs }}"
        timeout: "{{ ao_request_timeout }}"
        status_code: [200]
      register: __ao_users_lookup
      changed_when: false

    - name: Managing Users
      ansible.builtin.uri:
        url: "{{ __url }}"
        method: "{{ __method }}"
        headers:
          Authorization: "Bearer {{ ao_access_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ omit if __method == 'DELETE' else __body }}"
        status_code: "{{ [204] if __method == 'DELETE' else ([201] if __method == 'POST' else [200]) }}"
        validate_certs: "{{ ao_validate_certs }}"
        timeout: "{{ ao_request_timeout }}"
      when: not (__state == 'absent' and __existing is not defined)
      loop: "{{ users if users is defined else ao_users }}"
      loop_control:
        loop_var: __ao_users_item
        label: "{{ __operation.verb }} User {{ __ao_users_item.username }}"
        pause: "{{ ao_configuration_users_loop_delay }}"
      async: "{{ ansible_check_mode | ternary(0, 1000) }}"
      poll: 0
      register: __users_job_async
      changed_when: (__users_job_async.changed if ansible_check_mode else false)
      vars:
        __operation: "{{ operation_translate[__ao_users_item.state | default(ao_state) | default('present')] }}"
        __existing: >-
          {{ (__ao_users_lookup.json[ao_configuration_users_list_key] | default([]))
             | selectattr('username', 'equalto', __ao_users_item.username) | list | first | default(omit) }}
        __state: "{{ __ao_users_item.state | default(ao_state | default('present')) }}"
        __method: "{{ 'DELETE' if __state == 'absent' else ('PATCH' if __existing is defined else 'POST') }}"
        __url: "{{ ao_hostname ~ '/api/v1/users' ~ ('/' ~ __existing.id if __existing is defined else '') }}"
        __body:
          username: "{{ __ao_users_item.username | mandatory }}"
          first_name: "{{ __ao_users_item.first_name | default(omit, true) }}"
          last_name: "{{ __ao_users_item.last_name | default(omit, true) }}"
          email: "{{ __ao_users_item.email | default(omit, true) }}"
          password: "{{ __ao_users_item.password | default(omit, true) }}"
          is_enabled: "{{ __ao_users_item.is_enabled | default(true) }}"
          group_names: "{{ __ao_users_item.group_names | default([], true) }}"

    - name: Flag for errors (check mode only)
      ansible.builtin.set_fact:
        error_flag: true
      when: ansible_check_mode and __users_job_async.failed is defined and __users_job_async.failed

    - name: Managing Users | Wait for finish the user management
      when:
        - not ansible_check_mode
        - __users_job_async_results_item.ansible_job_id is defined
      ansible.builtin.include_role:
        name: zjleblanc.ao_configuration.collect_async_status
      loop: "{{ __users_job_async.results }}"
      loop_control:
        loop_var: __users_job_async_results_item
        label: >-
          {{ __operation.verb }} User {{ __users_job_async_results_item.__ao_users_item.username }}
          | Wait for finish the user {{ __operation.action }}
      vars:
        cas_secure_logging: "{{ ao_configuration_users_secure_logging }}"
        cas_async_delay: "{{ ao_configuration_users_async_delay }}"
        cas_async_retries: "{{ ao_configuration_users_async_retries }}"
        cas_job_async_results_item: "{{ __users_job_async_results_item }}"
        cas_register_subvar: ao_users
        cas_error_list_var_name: "ao_users_errors"
        __operation: >-
          {{ operation_translate[__users_job_async_results_item.__ao_users_item.state
             | default(ao_state) | default('present')] }}
        cas_object_label: >-
          {{ __operation.verb }} User {{ __users_job_async_results_item.__ao_users_item.username }}
          | Wait for finish the user {{ __operation.action }}

  always:
    - name: Cleanup async results files
      when:
        - not ansible_check_mode
        - __users_job_async_results_item.ansible_job_id is defined
      ansible.builtin.async_status:
        jid: "{{ __users_job_async_results_item.ansible_job_id }}"
        mode: cleanup
      loop: "{{ __users_job_async.results }}"
      loop_control:
        loop_var: __users_job_async_results_item
        label: "Cleaning up job results file: {{ __users_job_async_results_item.results_file | default('Unknown') }}"
...
