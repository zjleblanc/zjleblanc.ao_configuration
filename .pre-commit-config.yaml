---
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/ansible/ansible-lint.git
    rev: v26.10.1
    hooks:
      - id: ansible-lint
        pass_filenames: false
        always_run: true
        entry: ansible-lint
        args:
          - --profile=production
...
